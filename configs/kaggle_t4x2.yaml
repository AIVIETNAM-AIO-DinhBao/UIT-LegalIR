  vietlegal_e5:
    id: mainguyen9/vietlegal-e5
    revision: a814728d93e14566f9634b50a054e67699ea8818
    role: dense
    license: Apache-2.0
    prompt_query: "query: "
    prompt_document: "passage: "
    chunk_view: short
  vietnamese_embedding:
    id: AITeamVN/Vietnamese_Embedding_v2
    revision: 18b44161e041bf1d3a333ab5144b5b7b93f914d2
    role: dense
    license: Apache-2.0
    prompt_query: ""
    prompt_document: ""
    chunk_view: long
  nemotron:
    id: nvidia/Nemotron-3-Embed-1B-BF16
    revision: c0c9fea93ea424587517f2c59e20db9f1d6bf615
    role: dense
    license: OpenMDW-1.1
    prompt_query: "query: "
    prompt_document: "passage: "
    chunk_view: long
  jina:
    id: jinaai/jina-reranker-v3.5
    revision: e8a93f33f0b22108f8c2364f8484ce3422552fbc
