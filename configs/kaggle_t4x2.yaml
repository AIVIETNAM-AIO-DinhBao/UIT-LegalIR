chunking:
  short_words: 300
  short_overlap_words: 48
  long_words: 896
  long_overlap_words: 128

retrieval:
  per_channel_top_k: 150
  chunk_search_k: 1000
  fused_top_k: 200
  query_memory_neighbors: 60
  query_exact_weight: 4.0
  doc_second_chunk_weight: 0.1
  first_stage_tuning_questions: 2000
  coordinate_search_passes: 2
  rrf_k_values: [20, 40, 60]
  first_stage_weight_values: [0.0, 0.5, 1.0, 1.5, 2.0]

reranking:
  rerank_top_k: 80
  pairwise_max_length: 1536
  pairwise_evidence_tokens: 1400
  pairwise_batch_size: 8
  jina_window_size: 20
  jina_evidence_tokens: 384
  jina_final_top_k: 30
  evidence_chunks_per_document: 4
  final_rrf_k_values: [20, 40, 60]
  final_reranker_weight_values: [0.0, 0.5, 0.75, 1.0, 1.25, 1.5]
  final_first_stage_weight_values: [0.0, 0.1, 0.2, 0.3]

validation:
  folds: 5
  reranker_tuning_folds: [0]
