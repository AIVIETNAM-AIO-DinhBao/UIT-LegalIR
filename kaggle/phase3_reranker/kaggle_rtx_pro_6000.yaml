  calibration_questions: 400
  coordinate_search_passes: 2
  rrf_k_values: [20, 40, 60]
  first_stage_weight_values: [0.0, 0.5, 1.0, 1.5, 2.0]

reranking:
  rerank_top_k: 20
  pairwise_max_length: 512
  pairwise_evidence_tokens: 440
  pairwise_batch_size: 64
  causal_batch_size: 16
  evidence_chunks_per_document: 3
  calibration_questions: 400
  final_rrf_k_values: [5, 10, 20, 40]
  final_reranker_weight_values: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]
  final_first_stage_weight_values: [0.5, 0.75, 1.0, 1.25, 1.5]

validation:
  folds: 5
  reranker_tuning_folds: [0]