[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uit-legalir"
version = "0.1.0"
description = "Offline retrieval pipeline for UIT DSC 2026 LegalIR"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

